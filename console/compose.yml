# InstallZero eval console and its database, at http://localhost:81.
# Jobs run on the Windows host: agent\eval\worker\Start-EvalWorker.ps1 polls
# the console. Mongo is not published, so it cannot clash with a project's own
# Mongo on 27017; reach it with `docker compose exec mongo mongosh`.
#
#   cd console; docker compose up -d --build
#
# Needs MONGO_ROOT_PASSWORD in console\.env (git-ignored).
name: installzero

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in console/.env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:81:8300"
    environment:
      DATABASE_NAME: installzero
      MONGO_URL: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/
      EVAL_GPU_LIMIT: ${EVAL_GPU_LIMIT:-1}
      EVAL_HOSTED_MODELS: ${EVAL_HOSTED_MODELS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # The console adds models first used in a campaign to this file.
      - ./models.json:/evals/models.json
      # Facts for runs probed on the Windows host (Invoke-ProbeEval.ps1), for diagnosis.
      - ../agent/eval/repos.json:/evals/host-repos.json:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
