# Builds the installzero binaries and attaches them, with SHA256SUMS, to the
# GitHub release of the pushed tag (created when missing). Project owners link
# or copy these assets; scripts/build-binaries.sh has the flags and why.
name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: bash scripts/build-binaries.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "installzero $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/bin/* --clobber
          {
            echo "### installzero $GITHUB_REF_NAME"
            echo ""
            echo '```'
            cat dist/bin/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
